name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:
  # JOB 1: Unit tests
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc-s3 boto3

      - name: Pull data with DVC
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
          AWS_DEFAULT_REGION: ap-southeast-1
        run: |
          python - <<'PYEOF'
          import os, json, subprocess

          creds_raw = os.environ.get("STORAGE_CREDENTIALS", "")
          data = json.loads(creds_raw)

          key_id = data.get("aws_access_key_id") or data.get("AWS_ACCESS_KEY_ID")
          secret_key = data.get("aws_secret_access_key") or data.get("AWS_SECRET_ACCESS_KEY")

          env = os.environ.copy()
          env["AWS_ACCESS_KEY_ID"] = key_id
          env["AWS_SECRET_ACCESS_KEY"] = secret_key

          subprocess.run(["python", "-m", "dvc", "pull"], check=True, env=env)
          PYEOF

  # JOB 2: Train
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc-s3

      - name: Pull data with DVC
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
          AWS_DEFAULT_REGION: ap-southeast-1
        run: |
          python - <<'PYEOF'
          import os, json, subprocess

          creds_raw = os.environ.get("STORAGE_CREDENTIALS", "")
          data = json.loads(creds_raw)

          key_id = data.get("aws_access_key_id") or data.get("AWS_ACCESS_KEY_ID")
          secret_key = data.get("aws_secret_access_key") or data.get("AWS_SECRET_ACCESS_KEY")

          env = os.environ.copy()
          env["AWS_ACCESS_KEY_ID"] = key_id
          env["AWS_SECRET_ACCESS_KEY"] = secret_key

          subprocess.run(["python", "-m", "dvc", "pull"], check=True, env=env)
          PYEOF

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import os, json, boto3

          creds_raw = os.environ.get("STORAGE_CREDENTIALS", "")
          data = json.loads(creds_raw)

          key_id = data.get("aws_access_key_id") or data.get("AWS_ACCESS_KEY_ID")
          secret_key = data.get("aws_secret_access_key") or data.get("AWS_SECRET_ACCESS_KEY")
          bucket_name = "${{ secrets.ARTIFACT_BUCKET }}"

          s3_client = boto3.client(
              "s3",
              aws_access_key_id=key_id,
              aws_secret_access_key=secret_key,
              region_name="ap-southeast-1"
          )
          s3_client.upload_file(
              "models/model.joblib",
              bucket_name,
              "artifacts/current/model.joblib"
          )
          print(f"Uploaded model to s3://{bucket_name}/artifacts/current/model.joblib")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  # JOB 3: Quality Gate
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          import sys

          f1_val = float("${{ needs.train.outputs.f1 }}")
          threshold = 0.65
          print(f"Current F1-Score: {f1_val}, Threshold: {threshold}")

          if f1_val < threshold:
              print("Quality Gate FAILED: F1-Score is lower than 0.65!")
              sys.exit(1)
          
          print("Quality Gate PASSED!")
          PYEOF

  # JOB 4: Release
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/healthz)
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Deployment Successful! Server is healthy."
            else
              echo "Deployment Failed! Server returned HTTP $HTTP_STATUS"
              exit 1
            fi