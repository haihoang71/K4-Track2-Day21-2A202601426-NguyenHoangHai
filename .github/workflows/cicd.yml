name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:
  # JOB 1: Chạy unit tests trên dữ liệu ảo (không cần cloud storage)
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc-s3

      - name: Pull data with DVC
        run: |
          # Parse AWS Credentials từ secret STORAGE_CREDENTIALS
          AWS_KEY_ID=$(echo '${{ secrets.STORAGE_CREDENTIALS }}' | jq -r '.aws_access_key_id')
          AWS_SECRET=$(echo '${{ secrets.STORAGE_CREDENTIALS }}' | jq -r '.aws_secret_access_key')
          
          # Xuất thành biến môi trường tạm thời cho lệnh DVC bên dưới
          export AWS_ACCESS_KEY_ID=$AWS_KEY_ID
          export AWS_SECRET_ACCESS_KEY=$AWS_SECRET
          export AWS_DEFAULT_REGION=ap-southeast-1
          
          # Kéo dữ liệu bằng python module DVC
          python -m dvc pull

  # JOB 2: Huấn luyện mô hình trên dữ liệu thực, upload artifact lên cloud storage
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # TODO 2.11.2: Parse AWS credentials từ secret STORAGE_CREDENTIALS
        run: |
          AWS_KEY_ID=$(echo '${{ secrets.STORAGE_CREDENTIALS }}' | jq -r '.aws_access_key_id')
          AWS_SECRET=$(echo '${{ secrets.STORAGE_CREDENTIALS }}' | jq -r '.aws_secret_access_key')
          echo "AWS_ACCESS_KEY_ID=$AWS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=ap-southeast-1" >> $GITHUB_ENV

      - name: Pull data with DVC
        # TODO 2.11.3
        run: dvc pull

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        # TODO 2.11.4: Đọc f1_score từ outputs/report.json ra GITHUB_OUTPUT
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        # TODO 2.11.5: Sử dụng boto3 SDK để upload file model.joblib lên AWS S3
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket_name = "${{ secrets.ARTIFACT_BUCKET }}"
          s3_client = boto3.client("s3")
          s3_client.upload_file(
              "models/model.joblib",
              bucket_name,
              "artifacts/current/model.joblib"
          )
          print(f"Uploaded model to s3://{bucket_name}/artifacts/current/model.joblib")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  # JOB 3: Kiểm tra chất lượng - chỉ cho phép triển khai khi f1_score >= 0.65
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        # TODO 2.11.6
        run: |
          python - <<'PYEOF'
          import sys

          f1_val = float("${{ needs.train.outputs.f1 }}")
          threshold = 0.65
          print(f"Current F1-Score: {f1_val}, Threshold: {threshold}")

          if f1_val < threshold:
              print("Quality Gate FAILED: F1-Score is lower than 0.65!")
              sys.exit(1)
          
          print("Quality Gate PASSED!")
          PYEOF

  # JOB 4: Triển khai sau khi quality gate qua
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # TODO 2.11.7 & 2.11.8: Restart service và kiểm tra endpoint /healthz
            sudo systemctl restart income-api
            sleep 5
            
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/healthz)
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Deployment Successful! Server is healthy."
            else
              echo "Deployment Failed! Server returned HTTP $HTTP_STATUS"
              exit 1
            fi